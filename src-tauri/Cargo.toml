[package]
name = "phasr"
version = "0.3.7"
description = "Phasr — run multiple coding agents in parallel, each in an isolated git worktree."
authors = ["Rishabh Bhatia <irishabh96@gmail.com>"]
edition = "2021"

[lib]
name = "phasr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
base64 = "0.22"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
parking_lot = "0.12"
base64 = "0.22"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
async-trait = "0.1"
portable-pty = "0.9"
tokio-util = { version = "0.7", features = ["compat"] }
bytes = "1"
anyhow = "1"
notify = "6"
notify-debouncer-mini = { version = "0.4", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
jsonwebtoken = { version = "9", default-features = false }
# Hardware-derived machine id (IOPlatformUUID on macOS) so cloud-sync's
# per-machine local_paths key survives a wiped profile — the localStorage
# id it replaces did not.
machine-uid = "0.5"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
wiremock = "0.6"
