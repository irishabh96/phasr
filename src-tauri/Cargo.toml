[package]
name = "phasr"
version = "0.3.1"
description = "Phasr — run multiple coding agents in parallel, each in an isolated git worktree."
authors = ["Rishabh Bhatia <irishabh96@gmail.com>"]
edition = "2021"
# Two bin targets exist (the `phasr` app from src/main.rs + the `phasr-cli`
# sidecar below), so `cargo run` / `tauri dev` (which run bare `cargo run`) need
# to be told which is the default — the app.
default-run = "phasr"

[lib]
name = "phasr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The `phasr` agent CLI (Story CLI1 / §R7): a dependency-light thin client the
# spawned ticket agents shell out to. The APP binary already owns the package
# name "phasr" (from src/main.rs), so this target is named "phasr-cli" to avoid a
# duplicate-binary-name collision; the on-disk/invocation name is irrelevant —
# agents call it via the absolute "$PHASR_BIN" the app injects (§J4). Bundle it as
# an externalBin sidecar named `phasr-cli` via a pre-bundle copy step.
[[bin]]
name = "phasr-cli"
path = "src/bin/phasr_cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
base64 = "0.22"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
parking_lot = "0.12"
base64 = "0.22"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
async-trait = "0.1"
portable-pty = "0.9"
tokio-util = { version = "0.7", features = ["compat"] }
bytes = "1"
anyhow = "1"
notify = "6"
notify-debouncer-mini = { version = "0.4", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
jsonwebtoken = { version = "9", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
wiremock = "0.6"
