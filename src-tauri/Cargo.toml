[package]
name = "phasr"
version = "0.4.4"
description = "Phasr — run multiple coding agents in parallel, each in an isolated git worktree."
authors = ["Rishabh Bhatia <irishabh96@gmail.com>"]
edition = "2021"

[lib]
name = "phasr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
base64 = "0.22"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
parking_lot = "0.12"
base64 = "0.22"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
async-trait = "0.1"
portable-pty = "0.9"
tokio-util = { version = "0.7", features = ["compat"] }
bytes = "1"
anyhow = "1"
notify = "6"
notify-debouncer-mini = { version = "0.4", default-features = false }
# Agent-signal heuristics (approval-dialog patterns over PTY output) and
# reading the user's Codex `notify` setting so phasr can chain it.
regex = "1"
toml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
jsonwebtoken = { version = "9", default-features = false }
# Hardware-derived machine id (IOPlatformUUID on macOS) so cloud-sync's
# per-machine local_paths key survives a wiped profile — the localStorage
# id it replaces did not.
machine-uid = "0.5"
sha2 = "0.10"
# B1's VT engine, behind `--features vt-alacritty`. Apache-2.0, `Send`, no
# native toolchain. See `src/vt/alacritty.rs` for why this rather than
# `libghostty-vt`, and what swapping later costs.
alacritty_terminal = { version = "0.26", optional = true, default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
# The main webview's configuration (Writing Tools off; src/writing_tools.rs).
# Same crate and version tauri/wry already link.
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebViewConfiguration"] }
# API keys for agents (Settings → Agents & keys) live in the login Keychain,
# never in SQLite or the cloud. macOS-only: elsewhere `secrets::KeychainStore`
# reports "keychain unavailable" and the in-memory store backs tests.
keyring = { version = "3", default-features = false, features = ["apple-native"] }
# Needs-you notifications with Allow / Deny buttons (`notifications::native`).
# Already in the tree under `tauri-plugin-notification`, which can't show
# buttons or report a click on desktop.
mac-notification-sys = "0.6.15"
# Voice input (`voice`): the microphone through CoreAudio, transcribed on
# this Mac by whisper.cpp (Metal). The model is downloaded on request, never
# bundled. macOS-only like the app; elsewhere the commands report it.
cpal = "0.18"
whisper-rs = { version = "0.16", features = ["metal"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
block2 = "0.6"

# VT engine selection for `src/vt` (B1).
#
# `vt-alacritty` is implemented (`vt/alacritty.rs`). `vt-ghostty` is still a
# placeholder: `libghostty-vt` needs Zig 0.16.x on PATH for ANY `cargo check`,
# which would break every contributor and the Linux CI box on the same day, so
# it stays unimplemented until someone decides to pay that toolchain cost.
# Both sit behind the same `VtEngine` trait, so that decision is a new file
# and a feature flag -- not a refactor.
#
# NEITHER is in `default`: nothing in `src/vt` is wired into the live PTY
# path yet (see `vt/mod.rs`), so the shipping build carries no VT engine.
[features]
default = []
vt-ghostty = []
vt-alacritty = ["dep:alacritty_terminal"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
wiremock = "0.6"
