name: Release

# Tag-triggered macOS build. Push a v* tag to produce an Apple Silicon
# DMG in a draft GitHub Release. The maintainer writes notes and
# publishes. Intel Mac support isn't built pre-1.0 — adding it is a
# second matrix entry when there's demand.
#
# Required GitHub Environment: `release`
# Add these as environment secrets or variables under:
# Settings → Environments → release → Secrets and variables
#   VITE_CLERK_PUBLISHABLE_KEY
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
# Optional:
#   VITE_CLERK_DESKTOP_CALLBACK_URL
#   VITE_SENTRY_DSN
#   VITE_SENTRY_TRACES_SAMPLE_RATE
#   VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE
#   VITE_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE
# These bake into the JS bundle so public DMGs ship with cloud sync
# working. The repo itself never sees the values.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build aarch64 DMG
    runs-on: macos-15
    environment: release
    env:
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || vars.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_CLERK_DESKTOP_CALLBACK_URL: ${{ secrets.VITE_CLERK_DESKTOP_CALLBACK_URL || vars.VITE_CLERK_DESKTOP_CALLBACK_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN || vars.VITE_SENTRY_DSN }}
      VITE_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE }}
      VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE: ${{ vars.VITE_SENTRY_REPLAYS_SESSION_SAMPLE_RATE }}
      VITE_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE: ${{ vars.VITE_SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE }}
      VITE_SENTRY_RELEASE: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags: the rollback guard below needs v0.4.4.
          fetch-depth: 0

      # Rollback guard (RELEASING.md → "Rollback safety"). Builds up to
      # 0.4.3 refuse to open a database that has a migration they don't
      # know ("migration 15 was previously applied but is missing" — the
      # 0.3.7 incident). v0.4.4 is the first build that tolerates them, so
      # nothing carrying migration 0015+ may ship unless v0.4.4 is already
      # out — i.e. is an ancestor of what's being released.
      - name: Guard against releasing migrations 0015+ before v0.4.4
        run: |
          latest=$(ls src-tauri/migrations | sed -n 's/^\([0-9][0-9]*\)_.*\.sql$/\1/p' | sort -n | tail -1)
          echo "Latest migration: ${latest:-none}"
          if [ -n "$latest" ] && [ "$((10#$latest))" -ge 15 ]; then
            if ! git rev-parse -q --verify "refs/tags/v0.4.4^{commit}" >/dev/null; then
              echo "::error::Migration $latest needs v0.4.4 released first, and there is no v0.4.4 tag. See RELEASING.md → Rollback safety."
              exit 1
            fi
            if ! git merge-base --is-ancestor v0.4.4 HEAD; then
              echo "::error::Migration $latest needs v0.4.4 released first, and v0.4.4 is not an ancestor of $GITHUB_REF_NAME. See RELEASING.md → Rollback safety."
              exit 1
            fi
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # pnpm version sourced from package.json "packageManager" —
      # passing `with: version:` here too trips ERR_PNPM_BAD_PM_VERSION.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Verify release environment
        run: |
          test -n "$VITE_CLERK_PUBLISHABLE_KEY" || (echo "Missing VITE_CLERK_PUBLISHABLE_KEY in the release environment" && exit 1)
          test -n "$VITE_SUPABASE_URL" || (echo "Missing VITE_SUPABASE_URL in the release environment" && exit 1)
          test -n "$VITE_SUPABASE_ANON_KEY" || (echo "Missing VITE_SUPABASE_ANON_KEY in the release environment" && exit 1)

      - name: Build + bundle + upload to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Phasr ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin
