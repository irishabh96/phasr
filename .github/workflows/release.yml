name: Release

# Tag-triggered macOS build. Push a v* tag to produce an Apple Silicon
# DMG in a draft GitHub Release. The maintainer writes notes and
# publishes. Intel Mac support isn't built pre-1.0 — adding it is a
# second matrix entry when there's demand.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   VITE_CLERK_PUBLISHABLE_KEY
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
# These bake into the JS bundle so public DMGs ship with cloud sync
# working. The repo itself never sees the values.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build aarch64 DMG
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # pnpm version sourced from package.json "packageManager" —
      # passing `with: version:` here too trips ERR_PNPM_BAD_PM_VERSION.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build + bundle + upload to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Phasr ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin
