name: CI

# Cheap per-commit checks. The release pipeline (release.yml) handles
# the actual macOS bundle build — too slow to run on every push.

on:
  pull_request:
  push:
    branches: [master, rebuild, feat/task-board]

jobs:
  web:
    name: Web — typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # pnpm version sourced from package.json "packageManager" —
      # passing `with: version:` here too trips ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Web — Playwright e2e
    runs-on: ubuntu-latest
    env:
      # The suite runs against the mocked-IPC dev server; these only need to
      # EXIST so main.tsx mounts the router instead of the config-error screen.
      # The Clerk key decodes to clerk.example.com — clerk-js never loads and
      # the auth gate is the mocked Rust session, not Clerk.
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      VITE_SUPABASE_URL: https://stub.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-stub-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  rust:
    name: Rust — check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux deps for tauri-build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
